x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: orion-redis
    <<: *default-logging
    restart: unless-stopped
    volumes:
      - redis_data:/data

  app:
    image: ghcr.io/guyavrhm/orion:latest
    build: .
    container_name: orion-app
    <<: *default-logging
    restart: unless-stopped
    command: npm run start:all
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - NODE_ENV=production
      - ORION_DATA_DIR=/data
    ports:
      - "3000:3000"
    volumes:
      - orion_data:/data
    depends_on:
      - redis

volumes:
  orion_data:
    name: orion_data
  redis_data:
    name: redis_data
